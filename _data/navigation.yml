# Main menu of the /new preview. Top level = the groups; each has an overview page and a page with the
# group's stories. `id` is the group name used by the character pages (`group:` in their front matter);
# the characters of a group decide which stories appear on its stories page and which menu entry is
# marked as the current section.
- title: Mittelgruppe
  id: mittelgruppe
  children:
    - title: Übersicht
      url: /mittelgruppe.html
    - title: Geschichten
      url: /geschichten/mittelgruppe/
- title: Südgruppe
  id: suedgruppe
  children:
    - title: Übersicht
      url: /suedgruppe.html
    - title: Geschichten
      url: /geschichten/suedgruppe/
# A top-level entry without children is a plain link.
- title: Suche
  url: /suche/
