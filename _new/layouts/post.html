---
layout: default
---
<nav id="nav-single">
  <h3 class="assistive-text">Beitrags-Navigation</h3>
  {%- if page.previous %}<span class="nav-previous"><a href="{{ page.previous.url | relative_url }}"><span class="meta-nav">←</span> Vorheriger</a></span>{% endif %}
  {%- if page.next %}<span class="nav-next"><a href="{{ page.next.url | relative_url }}">Nächster <span class="meta-nav">→</span></a></span>{% endif %}
</nav>
<article class="post type-post status-publish format-standard hentry">
  <header class="entry-header">
    <h1 class="entry-title">{{ page.title | escape }}</h1>
    <div class="entry-meta">
      <span class="sep">Veröffentlicht am </span><time class="entry-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time>
      {%- if page.author %}<span class="by-author"> <span class="sep"> von </span> <span class="author vcard">{{ page.author | escape }}</span></span>{% endif %}
    </div>
  </header>
  <div class="entry-content">
    {{ content }}
  </div>
</article>
