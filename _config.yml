# Settings for the whole site. Jekyll does not reload this file with `jekyll serve`: restart the server after a change.
# The site is built and published by GitHub Actions (./build-site.sh, .github/workflows/deploy.yml).

title: Phexkinder
lang: de
email:
description: >-
  Fortes Fortuna Adiuvat
baseurl:  # the subpath of the site, empty = served at the domain root
url: https://www.phexkinder.de # the base hostname & protocol for the site
twitter_username:
github_username:

# Build settings
markdown: kramdown
theme: null # own layouts in _layouts/ and _includes/, no gem theme
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

# Blog index (index.html): ten stories per page, "<!--more-->" in a story ends its excerpt.
paginate: 10
paginate_path: "/page:num/"
excerpt_separator: "<!--more-->"

# One page per author (/autor/taran/ ...), listing their posts: generated by _plugins/author_pages.rb.
author_pages: true

collections:
  # One stories page per group (/geschichten/mittelgruppe/ ...), see _data/navigation.yml.
  stories:
    output: true
    permalink: /geschichten/:name/

# Files that are not part of the site.
exclude:
  - old-index.md # home page of the /old copy, see _config_old.yml
  - build-site.sh
  - serve-site.sh
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

# Keep static assets such as PDFs out of the sitemap.
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
