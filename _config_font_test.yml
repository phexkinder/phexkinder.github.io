# Overlay config for the /font-test copy: the whole site with Uncial Antiqua in capitals as the title font,
# to compare it with Mason Serif. ./build-site.sh builds it on top of _config.yml into _site/font-test/.
baseurl: /font-test
font_test: true # adds assets/css/phexkinder-font-test.css, leaves out the search (see _layouts/default.html)
noindex: true
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
# Shared files and pages that only exist once on the main site.
exclude:
  - old-index.md
  - suche.html
  - 404.html
  - assets
  - CNAME
  - robots.txt
  - Gemfile
  - Gemfile.lock
  - build-site.sh
  - serve-site.sh
  - README.md
  - vendor
  - node_modules
