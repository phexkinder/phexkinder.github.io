version: 2
updates:
  # Ruby gems (github-pages and friends). Security alerts are separate and stay on.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  # Versions of the actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
