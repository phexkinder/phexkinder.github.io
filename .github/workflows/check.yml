name: Check

# Runs on every pull request and on master. It builds the site exactly like the deploy workflow does
# (deploy.yml) but publishes nothing; these checks only catch problems before they get merged.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7

      - name: No forbidden or oversized files
        run: .github/scripts/forbidden-files.sh

      - name: Images are not oversized
        run: .github/scripts/check-images.sh

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # reads .ruby-version and Gemfile.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # for the search indexer run by build-site.sh

      - name: Content (front matter and data files)
        run: ruby .github/scripts/validate-content.rb

      - name: Content checks catch deliberate mistakes
        run: .github/scripts/test-validate-content.sh

      - name: Build the site (/ and /new, with the search index)
        run: ./build-site.sh

      - name: Internal links and images
        run: |
          gem install html-proofer -v 5.2.3 --no-document
          htmlproofer ./_site --disable-external --assume-extension .html --no-enforce-https
