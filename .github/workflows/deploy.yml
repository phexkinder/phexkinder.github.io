name: Deploy

# Builds the site (./build-site.sh: current design at /, /new preview, search index) and publishes it
# with GitHub Pages. Needs Settings > Pages > Source = "GitHub Actions". Runs on every push to master.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # reads .ruby-version and Gemfile.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # for the search indexer run by build-site.sh

      - name: Build the site
        run: ./build-site.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
