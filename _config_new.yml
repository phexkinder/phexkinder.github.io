# Overlay config for the /new preview (old WordPress look).
# ./build-site.sh builds it on top of _config.yml into _site/new/.
# The root site keeps using _config.yml with its own layouts in _layouts/ and _includes/.
baseurl: /new
description: >-
  Fortes Fortuna Adiuvat
layouts_dir: _new/layouts
includes_dir: _new/includes
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
paginate: 10
paginate_path: "/page:num/"
excerpt_separator: "<!--more-->"
noindex: true
# One page per author (/autor/taran/ ...), listing their posts.
collections:
  authors:
    output: true
    permalink: /autor/:name/
  # One stories page per group (/geschichten/mittelgruppe/ ...), see _data/navigation.yml.
  stories:
    output: true
    permalink: /geschichten/:name/
# Theme assets and post images are shared with the root site (/assets/...).
exclude:
  - index.md
  - assets
  - Gemfile
  - Gemfile.lock
  - build-site.sh
  - _config_new.yml
  - CNAME
  - vendor
  - node_modules
  - README.md
  - robots.txt
